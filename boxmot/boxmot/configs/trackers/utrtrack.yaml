# UTR-Track-v0 (class UTRTrack): XYAH TL-UKF, single-object mode.
# Defaults = values used by utrtrack_pipeline.py --tracker_type utrtrack_v0 (MBEC paper).
# The pipeline also runs YOLO at conf 0.45 for v0.

min_conf:
  type: uniform
  default: 0.1
  range: [0.1, 0.5]

max_cos_dist:
  type: uniform
  default: 0.9
  range: [0.2, 0.95]

max_iou_dist:
  type: uniform
  default: 0.9
  range: [0.5, 0.95]

max_age:
  type: randint
  default: 500
  range: [30, 1001]  # upper bound exclusive

n_init:
  type: randint
  default: 1
  range: [1, 4]  # upper bound exclusive

nn_budget:
  type: choice
  default: 100
  options: [100]

mc_lambda:
  type: uniform
  default: 0.98
  range: [0.90, 0.999]

ema_alpha:
  type: uniform
  default: 0.95
  range: [0.7, 0.99]

single_object_mode:
  type: choice
  default: true
  options: [true, false]

reacquire_min_iou:
  type: uniform
  default: 0.03
  range: [0.0, 0.3]

reacquire_max_cost:
  type: uniform
  default: 0.60
  range: [0.3, 0.9]

reacquire_max_age:
  type: randint
  default: 30
  range: [5, 501]  # upper bound exclusive

max_virtual_age:
  type: randint
  default: 5
  range: [1, 31]  # upper bound exclusive

virtual_recent_hq_gap:
  type: randint
  default: 4
  range: [1, 13]  # upper bound exclusive

virtual_conf:
  type: uniform
  default: 0.28
  range: [0.1, 0.34]
